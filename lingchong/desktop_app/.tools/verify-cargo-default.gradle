gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) return
    def task = app.tasks.named('rustBuildArmDebug').get()
    def executable = new File(task.cargoExecutable.get())
    assert executable.isAbsolute(): 'Cargo should resolve without relying on IDE PATH'
    assert executable.isFile(): 'Resolved Cargo executable must exist'
    assert executable.name == 'cargo.exe'
    println "Verified default Cargo executable: ${executable}"
}
