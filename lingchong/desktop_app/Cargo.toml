[workspace]
resolver = "2"
members = [
    "crates/deskpet-core",
    "crates/deskpet-storage",
    "crates/deskpet-collector",
    "crates/deskpet-scheduler",
    "crates/deskpet-agent",
    "crates/deskpet-tts",
    "crates/deskpet-app",
    "crates/deskpet-dump",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
async-trait = "0.1"
log = "0.4"
env_logger = "0.11"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
toml = "0.8"
dirs = "5"
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = "2"
